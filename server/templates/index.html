<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP32-S3 EYE · IMU 实时监测</title>
<script src="/static/echarts.min.js"></script>
<script>(function(){if(typeof echarts==='undefined'){var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js';document.head.appendChild(s);}})();</script>
<style>
:root{
  --bg:#0f172a; --card:#1e293b; --card2:#16203a; --line:rgba(148,163,184,.16);
  --txt:#e2e8f0; --dim:#94a3b8; --dim2:#64748b;
  --cyan:#22d3ee; --green:#34d399; --yellow:#fbbf24; --red:#f87171; --violet:#a78bfa; --orange:#fb923c;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{background:radial-gradient(1200px 600px at 80% -10%, rgba(34,211,238,.08), transparent 60%), var(--bg); color:var(--txt); font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif; min-height:100vh;}
.mono{font-family:Consolas,"JetBrains Mono",monospace;}
.topbar{display:flex; align-items:center; gap:14px; padding:14px 26px; border-bottom:1px solid var(--line); background:rgba(15,23,42,.85); backdrop-filter:blur(6px); position:sticky; top:0; z-index:10;}
.brand{font-size:19px; letter-spacing:.5px;}
.brand b{color:var(--cyan);}
.brand-sub{color:var(--dim); font-weight:600;}
.top-right{margin-left:auto; display:flex; align-items:center; gap:12px;}
.clock{color:var(--dim); font-family:Consolas,monospace; font-size:14px;}
.pill{font-size:12px; padding:4px 10px; border-radius:999px; border:1px solid var(--line); background:var(--card2); color:var(--dim); white-space:nowrap;}
.pill-online{color:var(--green); border-color:rgba(52,211,153,.4);}
.pill-warn{color:var(--yellow); border-color:rgba(251,191,36,.4);}
.pill-offline{color:var(--red); border-color:rgba(248,113,113,.4);}
.pill-live{color:var(--cyan); border-color:rgba(34,211,238,.35);}
.layout{display:grid; grid-template-columns:380px 1fr; gap:18px; padding:18px 26px;}
.col{display:flex; flex-direction:column; gap:18px;}
.card{background:linear-gradient(180deg, rgba(30,41,59,.92), rgba(30,41,59,.78)); border:1px solid var(--line); border-radius:14px; box-shadow:0 0 0 1px rgba(56,189,248,.05), 0 10px 30px rgba(2,6,23,.45); padding:16px 18px;}
.card-h{display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
.card-t{font-size:15px; font-weight:700; letter-spacing:.3px;}
.dash-row{display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid rgba(148,163,184,.1);}
.dash-row:last-child{border-bottom:none;}
.dash-label{font-size:12px; color:var(--dim); white-space:nowrap;}
.dash-value{font-size:14px; font-weight:700; font-family:Consolas,monospace; text-align:right;}
.dash-value.x{color:var(--cyan);}
.dash-value.y{color:var(--violet);}
.dash-value.z{color:var(--green);}
.dash-value.mag{color:var(--orange); font-size:16px;}
.unit{font-size:11px; color:var(--dim2); font-weight:400; margin-left:4px;}
.mag-row{background:rgba(251,146,60,.08); border-radius:8px; padding:9px 10px !important; margin-top:4px; border-bottom:none !important;}
.chart-wrap{position:relative;}
#imu_chart{width:100%; height:360px; border:none;}
.chart-overlay{position:absolute; top:0; left:0; right:0; bottom:0; display:flex; align-items:center; justify-content:center; background:rgba(15,23,42,.75); color:var(--dim2); font-size:15px; border-radius:8px; z-index:2;}
.legend{display:flex; gap:12px; font-size:12px; color:var(--dim); align-items:center;}
.legend i{display:inline-block; width:10px; height:3px; border-radius:2px; margin-right:5px; vertical-align:middle;}
.hint{color:var(--dim2); font-size:12px; line-height:1.7; margin-top:10px;}
.hint-ok{color:var(--green);}
.hint-warn{color:var(--yellow);}
.hint-info{color:var(--dim2);}
#offline_hint{font-size:12px; color:var(--red); margin-top:8px; padding:8px; background:rgba(248,113,113,.08); border-radius:8px; border:1px solid rgba(248,113,113,.2);}
#offline_hint.ok{color:var(--green); background:rgba(52,211,153,.08); border-color:rgba(52,211,153,.2);}
#offline_hint.warn{color:var(--yellow); background:rgba(251,191,36,.08); border-color:rgba(251,191,36,.2);}
@media (max-width:1000px){ .layout{grid-template-columns:1fr;} }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">&#x1F527; <b>ESP32-S3 EYE</b> <span class="brand-sub">· IMU 实时监测</span></div>
  <div class="top-right">
    <span class="pill pill-online" id="status_pill">&#x23F3; 检测中</span>
    <span class="clock" id="clock">--:--:--</span>
  </div>
</header>
<main class="layout">
  <section class="col">
    <div class="card">
      <div class="card-h"><span class="card-t">&#x1F4E1; 设备信息</span></div>
      <div class="dash-row"><span class="dash-label">设备名称</span><span class="dash-value" style="color:var(--cyan);">ESP32-S3-EYE</span></div>
      <div class="dash-row"><span class="dash-label">设备 IP</span><span class="dash-value mono" id="dev_ip">--</span></div>
      <div class="dash-row"><span class="dash-label">数据来源</span><span class="dash-value" id="imu_src">--</span></div>
      <div class="dash-row"><span class="dash-label">在线状态</span><span class="dash-value" id="online_status">--</span></div>
      <div id="offline_hint" style="display:none;">--</div>
    </div>
    <div class="card">
      <div class="card-h"><span class="card-t">&#x1F4CA; 实时加速度</span></div>
      <div class="dash-row"><span class="dash-label">Acc X</span><span class="dash-value x mono" id="val_x">--<span class="unit"> m/s&sup2;</span></span></div>
      <div class="dash-row"><span class="dash-label">Acc Y</span><span class="dash-value y mono" id="val_y">--<span class="unit"> m/s&sup2;</span></span></div>
      <div class="dash-row"><span class="dash-label">Acc Z</span><span class="dash-value z mono" id="val_z">--<span class="unit"> m/s&sup2;</span></span></div>
      <div class="dash-row mag-row"><span class="dash-label">&radic;(x&sup2;+y&sup2;+z&sup2;)</span><span class="dash-value mag mono" id="val_mag">--<span class="unit"> m/s&sup2;</span></span></div>
      <div class="hint hint-info" id="mag_hint">等待数据中...</div>
    </div>
    <div class="card">
      <div class="card-h"><span class="card-t">&#x1F550; 时间信息</span></div>
      <div class="dash-row"><span class="dash-label">采集时间</span><span class="dash-value mono" id="sample_time">--</span></div>
      <div class="dash-row"><span class="dash-label">服务器接收</span><span class="dash-value mono" id="received_time">--</span></div>
      <div class="dash-row"><span class="dash-label">数据延迟</span><span class="dash-value mono" id="latency_val">--</span></div>
    </div>
  </section>
  <section class="col">
    <div class="card">
      <div class="card-h">
        <span class="card-t">&#x1F4C8; IMU 波形图 (Acc X / Y / Z)</span>
        <span class="legend"><span><i style="background:#22d3ee"></i>X</span><span><i style="background:#a78bfa"></i>Y</span><span><i style="background:#34d399"></i>Z</span></span>
      </div>
      <div class="chart-wrap">
        <div id="imu_chart"></div>
        <div id="chart_overlay" class="chart-overlay" style="display:flex;">❌ 暂无数据，等待设备上线</div>
      </div>
    </div>
  </section>
</main>
<script>
var $ = function(id){ return document.getElementById(id); };
var useEcharts = typeof echarts !== 'undefined';
var chart = null;

function pad(n){ var s = n|0; return s < 10 ? '0' + s : '' + s; }
function fmtClock(ts){ var d = new Date(ts*1000); return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); }
function fmtTime(ts){ var d = new Date(ts*1000); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); }
function fmtLatency(secs){ if (secs == null || secs >= 999) return '--'; return secs.toFixed(1) + ' s'; }

function initChart(){
  if(useEcharts){
    chart = echarts.init($('imu_chart'));
    chart.setOption({
      backgroundColor:'transparent', animation:false,
      grid:{left:48,right:18,top:12,bottom:28},
      tooltip:{trigger:'axis',backgroundColor:'#0b1220',borderColor:'#334155',textStyle:{color:'#e2e8f0',fontSize:12}},
      xAxis:{type:'category',boundaryGap:false,data:[],axisLine:{lineStyle:{color:'#334155'}},axisTick:{show:false},axisLabel:{color:'#64748b',fontSize:10,rotate:30}},
      yAxis:{type:'value',scale:true,splitLine:{lineStyle:{color:'rgba(51,65,85,.35)'}},axisLabel:{color:'#64748b',fontSize:10},name:'m/s\u00B2',nameTextStyle:{color:'#64748b',fontSize:10}},
      series:[
        {name:'Acc X',type:'line',showSymbol:false,smooth:true,lineStyle:{width:2,color:'#22d3ee'},itemStyle:{color:'#22d3ee'},data:[]},
        {name:'Acc Y',type:'line',showSymbol:false,smooth:true,lineStyle:{width:2,color:'#a78bfa'},itemStyle:{color:'#a78bfa'},data:[]},
        {name:'Acc Z',type:'line',showSymbol:false,smooth:true,lineStyle:{width:2,color:'#34d399'},itemStyle:{color:'#34d399'},data:[]}
      ]
    });
    window.addEventListener('resize', function(){ chart.resize(); });
  }
}

function updateOnlineStatus(latency, source){
  var pill = $('status_pill');
  var status = $('online_status');
  var hint = $('offline_hint');
  if (source === 'device' && latency < 3.0){
    pill.innerHTML = '\u2705 在线';
    pill.className = 'pill pill-online';
    status.innerText = '\u2705 在线';
    status.style.color = 'var(--green)';
    hint.style.display = 'block';
    hint.className = 'ok';
    hint.innerHTML = '\u2714 设备正常上报数据';
    lastOnlineTime = new Date();
  } else if (source === 'device' && latency >= 3.0 && latency < 10.0){
    pill.innerHTML = '\u26A0\uFE0F 数据延迟';
    pill.className = 'pill pill-warn';
    status.innerText = '\u26A0\uFE0F 数据延迟';
    status.style.color = 'var(--yellow)';
    hint.style.display = 'block';
    hint.className = 'warn';
    hint.innerHTML = '最近数据: ' + fmtLatency(latency) + ' 前';
  } else {
    pill.innerHTML = '\u274C 设备离线';
    pill.className = 'pill pill-offline';
    status.innerText = '\u274C 设备离线';
    status.style.color = 'var(--red)';
    hint.style.display = 'block';
    hint.className = '';
    if (lastOnlineTime){
      hint.innerHTML = '最后在线: ' + fmtClock(lastOnlineTime.getTime()/1000);
    } else {
      hint.innerHTML = '尚未收到设备数据';
    }
  }
}
function updateImu(){
  fetch('/api/imu_data').then(function(r){ return r.json(); }).then(function(d){
    var samples = d.samples || [];
    var status = d.status || 'offline';
    var latency = d.imu_latency;
    var hasData = samples.length > 0;
    var isOnline = (status === 'online');
    var neverConnected = (latency === null);
    $('dev_ip').innerText = d.device_ip || '--';
    $('dev_ip').style.color = d.device_ip ? 'var(--txt)' : 'var(--dim2)';
    if (hasData) {
      $('imu_src').innerHTML = '<span style=\"color:var(--green);\">\uD83D\uDCE1 DEVICE</span>';
    } else {
      $('imu_src').innerHTML = '<span style=\"color:var(--dim);\">--</span>';
    }

    // Three-state online status
    var pill = $('status_pill');
    var statEl = $('online_status');
    var hintEl = $('offline_hint');

    if (isOnline) {
      pill.innerHTML = '\u2705 在线';
      pill.className = 'pill pill-online';
      statEl.innerText = '\u2705 在线';
      statEl.style.color = 'var(--green)';
      hintEl.style.display = 'block';
      hintEl.className = 'ok';
      hintEl.innerHTML = '\u2714 设备正常上报数据';
    } else if (neverConnected) {
      pill.innerHTML = '\u23F3 检测中';
      pill.className = 'pill pill-warn';
      statEl.innerText = '\u23F3 尚未连接设备';
      statEl.style.color = 'var(--yellow)';
      hintEl.style.display = 'block';
      hintEl.className = '';
      hintEl.innerHTML = '等待设备首次上报 IMU 数据';
    } else {
      pill.innerHTML = '\u274C 设备离线';
      pill.className = 'pill pill-offline';
      statEl.innerText = '\u274C 设备离线';
      statEl.style.color = 'var(--red)';
      hintEl.style.display = 'block';
      hintEl.className = '';
      var lastTime = d.last_imu_time ? fmtClock(d.last_imu_time) : '--';
      hintEl.innerHTML = '最后在线：' + lastTime;
    }

    // Sample values
    if (hasData) {
      var l = samples[samples.length-1];
      $('val_x').innerHTML = l.ax.toFixed(3) + '<span class="unit"> m/s\u00B2</span>';
      $('val_y').innerHTML = l.ay.toFixed(3) + '<span class="unit"> m/s\u00B2</span>';
      $('val_z').innerHTML = l.az.toFixed(3) + '<span class="unit"> m/s\u00B2</span>';
      var mag = Math.sqrt(l.ax*l.ax + l.ay*l.ay + l.az*l.az);
      $('val_mag').innerHTML = mag.toFixed(3) + '<span class="unit"> m/s\u00B2</span>';
      var diff = Math.abs(mag - 9.8);
      var magHint = $('mag_hint');
      if (diff < 0.5){
        magHint.innerHTML = '\u2705 静止验证通过：模长 \u2248 9.8 m/s\u00B2（重力加速度）';
        magHint.className = 'hint hint-ok';
      } else if (diff < 2.0){
        magHint.innerHTML = '\u26A0\uFE0F 设备可能正在运动中，模长偏离 9.8 m/s\u00B2';
        magHint.className = 'hint hint-warn';
      } else {
        magHint.innerHTML = '\uD83D\uDD0D 模长偏差较大 (' + diff.toFixed(2) + ')，请检查传感器';
        magHint.className = 'hint hint-info';
      }
      $('sample_time').innerText = l.t ? fmtTime(l.t) : '--';
      $('sample_time').style.color = 'var(--txt)';
      $('received_time').innerText = l.received_at ? fmtTime(l.received_at) : '--';
      $('received_time').style.color = 'var(--txt)';
      $('latency_val').innerText = fmtLatency(latency);
      $('latency_val').style.color = isOnline ? (latency < 3 ? 'var(--green)' : 'var(--yellow)') : 'var(--red)';
    } else {
      $('val_x').innerHTML = '--';
      $('val_y').innerHTML = '--';
      $('val_z').innerHTML = '--';
      $('val_mag').innerHTML = '--';
      $('mag_hint').innerHTML = '等待数据中...';
      $('mag_hint').className = 'hint hint-info';
      $('sample_time').innerText = '--'; $('sample_time').style.color = 'var(--dim2)';
      $('received_time').innerText = '--'; $('received_time').style.color = 'var(--dim2)';
      $('latency_val').innerText = '--'; $('latency_val').style.color = 'var(--dim2)';
    }
    if (useEcharts && chart) {
      var overlay = $('chart_overlay');
      if (hasData) {
        var gray = !isOnline;
        chart.setOption({
          xAxis: {data: samples.map(function(s){ return fmtClock(s.t); })},
          series: [
            {data: samples.map(function(s){ return s.ax; }), lineStyle: {color: gray ? '#4a5568' : '#22d3ee'}, itemStyle: {color: gray ? '#4a5568' : '#22d3ee'}},
            {data: samples.map(function(s){ return s.ay; }), lineStyle: {color: gray ? '#4a5568' : '#a78bfa'}, itemStyle: {color: gray ? '#4a5568' : '#a78bfa'}},
            {data: samples.map(function(s){ return s.az; }), lineStyle: {color: gray ? '#4a5568' : '#34d399'}, itemStyle: {color: gray ? '#4a5568' : '#34d399'}}
          ]
        });
        overlay.style.display = gray ? 'flex' : 'none';
        if (gray) overlay.innerHTML = '\u26A0\uFE0F 数据已过期';
      } else {
        overlay.style.display = 'flex';
        overlay.innerHTML = '\u274C 暂无数据，等待设备上线';
      }
    }
  }).catch(function(err){
    console.error('[IMU] fetch error:', err);
    $('status_pill').innerHTML = '\uD83D\uDD0C 服务器连接失败';
    $('status_pill').className = 'pill pill-offline';
    $('online_status').innerText = '\uD83D\uDD0C 连接失败';
    $('online_status').style.color = 'var(--red)';
  });
}

setInterval(function(){ $('clock').innerText = fmtClock(Date.now()/1000); }, 1000);
initChart();
updateImu();
setInterval(updateImu, 1000);
</script>
</body>
</html>
